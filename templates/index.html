<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medicine Review Predictor</title>

    <link rel="stylesheet" href="/static/style.css">
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
</head>

<body>

<div class="container">
    <div class="card shadow">

        <h2 class="text-center mb-4">
            Medicine Review Sentiment Analysis System
        </h2>

        <form action="/predict" method="post">

            <div class="mb-3">
                <label class="form-label" for="review">
                    Enter Medicine Review
                </label>

                <textarea
                    id="review"
                    class="form-control"
                    rows="8"
                    name="review"
                    placeholder="Type your medicine review here..."
                    required>{{ review if review else '' }}</textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Predict
            </button>

        </form>

        {% if error %}
        <div class="alert alert-danger mt-4" role="alert">
            {{ error }}
        </div>
        {% endif %}

        {% if prediction %}
        <hr>

        <h4 class="text-center">
            Prediction
        </h4>

        <h2 class="text-center">
            {{ prediction }}
        </h2>

        <h5 class="text-center">
            Confidence: {{ "%.2f"|format(probability) }}%
        </h5>
        {% endif %}

    </div>
</div>

</body>

</html>
